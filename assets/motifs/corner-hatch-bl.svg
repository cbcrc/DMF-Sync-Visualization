<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <!-- Bottom-left corner motif (icon-box-4): light-gray line-hatched quarter-DONUT
       (annulus quarter, donut centre pinned on the bottom-left corner) + small
       solid yellow triangle. Inner radius 58, outer radius 160. -->
  <defs>
    <pattern id="hatchGray" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="11" stroke="#C9C9C9" stroke-width="2"/>
    </pattern>
    <clipPath id="ringHatchBL">
      <path d="M0,40 A160,160 0 0 1 160,200 L58,200 A58,58 0 0 0 0,142 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ringHatchBL)">
    <rect x="0" y="0" width="220" height="200" fill="url(#hatchGray)"/>
  </g>
  <!-- yellow triangle pointing right -->
  <polygon points="60,52 60,138 132,95" fill="#F8CE5C"/>
</svg>
