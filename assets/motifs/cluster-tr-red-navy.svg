    <clipPath id="cRedTRN"><polygon points="40,8 40,132 158,70"/></clipPath>
  </defs>
  <g clip-path="url(#cRedTRN)"><rect x="20" y="-10" width="150" height="160" fill="url(#hRedTRN)"/></g>
