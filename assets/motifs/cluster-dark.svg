<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <!-- Top-right corner cluster for dark slides (cards-icons-3-dark):
       pale-teal solid triangle + white line-hatched triangle + small yellow triangle. -->
  <defs>
    <pattern id="hatchWhiteD" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="13" stroke="#FFFFFF" stroke-width="2.4"/>
    </pattern>
    <clipPath id="triHatchD">
      <polygon points="158,4 158,232 348,118"/>
    </clipPath>
  </defs>
  <!-- pale-teal solid triangle -->
  <polygon points="40,40 40,205 200,123" fill="#B7DADE"/>
  <!-- white hatched triangle -->
  <g clip-path="url(#triHatchD)">
    <rect x="110" y="-40" width="320" height="340" fill="url(#hatchWhiteD)"/>
  </g>
  <!-- small yellow triangle, lower -->
  <polygon points="150,205 150,300 232,252" fill="#F8CE5C"/>
</svg>
