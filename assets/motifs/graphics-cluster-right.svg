<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="540" height="500">
  <!-- Right-side triangle composition that an image placeholder sits over.
       Large light-gray RIGHT-pointing backdrop triangle, a large teal apex-DOWN
       triangle offset to the upper area, plus yellow / navy / small-gray
       right-pointing accents and a large red outline right-pointing triangle.
       Elements are spaced so the cluster reads clearly (not concentric). -->
  <!-- large teal triangle, apex DOWN, offset to the top -->
  <polygon points="100,0 325,110 100,235" fill="#B7DADE"/>
  <!-- large light-gray backdrop triangle, pointing RIGHT -->
  <polygon points="30,60 30,470 360,255" fill="#EFEFEF"/>
  <!-- small yellow triangle, pointing right, upper-right -->
  <polygon points="372,150 372,222 434,186" fill="#F8CE5C"/>
  <!-- large red outline triangle, pointing right, lower area -->
  <polygon points="210,220 210,470 440,360" fill="none" stroke="#E2231A" stroke-width="4"/>
  <!-- small navy triangle, pointing right, centre (over the red) -->
  <polygon points="300,305 300,367 356,336" fill="#2F6289"/>
  <!-- small gray triangle, pointing right, far right -->
  <polygon points="416,256 416,308 463,282" fill="#C9C9C9"/>
</svg>
