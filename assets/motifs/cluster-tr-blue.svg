<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <!-- Top-right: pale-blue hatched quarter-disc + navy solid triangle +
       red half-disc + navy outline triangle + gray ring. Corner at (300,0). -->
  <defs>
    <pattern id="hBlueTR" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="13" stroke="#B7DADE" stroke-width="2.6"/>
    </pattern>
    <!-- quarter-DONUT: donut centre pinned on the top-right corner (300,0),
         inner radius 95, outer radius 250. -->
    <clipPath id="cBlueTR"><path d="M50,0 A250,250 0 0 0 300,250 L300,95 A95,95 0 0 1 205,0 Z"/></clipPath>
  </defs>
  <g clip-path="url(#cBlueTR)"><rect x="0" y="0" width="300" height="250" fill="url(#hBlueTR)"/></g>
  <polygon points="150,30 150,104 214,67" fill="#2F6289"/>
  <path d="M232,28 a30,30 0 0 1 60,0 Z" fill="#E2231A"/>
  <polygon points="196,128 196,222 286,175" fill="none" stroke="#2F6289" stroke-width="4"/>
  <circle cx="150" cy="170" r="20" fill="none" stroke="#C9C9C9" stroke-width="5"/>
</svg>
