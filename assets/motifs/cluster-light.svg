<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <!-- Top-right corner cluster for light content slides:
       pale-teal solid triangle + navy line-hatched triangle. Brand hex baked in. -->
  <defs>
    <pattern id="hatchNavyL" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="13" stroke="#2F6289" stroke-width="2.4"/>
    </pattern>
    <clipPath id="triHatchL">
      <polygon points="170,4 170,250 360,127"/>
    </clipPath>
  </defs>
  <!-- pale-teal solid triangle, behind -->
  <polygon points="44,78 44,252 214,165" fill="#B7DADE"/>
  <!-- navy hatched triangle, in front -->
  <g clip-path="url(#triHatchL)">
    <rect x="120" y="-40" width="320" height="360" fill="url(#hatchNavyL)"/>
  </g>
</svg>
